name: "Sip image"

# Builds the Sip fork image and pushes it to GHCR. Push a tag like
# v2.25.3-sip.1 (see SIP.md), or run it manually against a tag.
on:
  push:
    tags:
      - 'v*-sip.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "ghcr.io/sip-inc/postiz:${TAG}" \
            --build-arg NEXT_PUBLIC_VERSION="${TAG}" \
            --label org.opencontainers.image.source=https://github.com/Sip-Inc/postiz \
            --pull \
            --provenance=false --sbom=false \
            --push .
